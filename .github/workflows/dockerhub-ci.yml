name: DockerHub CI

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_HUGO }}
          password: ${{ secrets.DOCKERHUB_TOKEN_HUGO }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfile-hugo/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME_HUGO }}/pipeline-t05-be:latest
